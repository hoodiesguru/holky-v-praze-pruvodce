<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | PragueGirls Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav">
            <a href="index.html" class="logo">PragueGirls Guide</a>
            <nav class="nav-links">
                <a href="index.html">Domů</a>
                <a href="about.html">O mně</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div style="max-width: 600px; margin: 60px auto; background: var(--surface); padding: 40px; border-radius: 16px; border: 1px solid var(--surface-border);">
            <h1 style="text-align: center;">Napište mi</h1>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 30px;">Máte tip na skvělé místo v Praze nebo dotaz k článku? Ozvěte se!</p>
            <form style="display: flex; flex-direction: column; gap: 20px;">
                <input type="text" placeholder="Vaše Jméno" style="padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--surface-border); border-radius: 8px; color: #fff;">
                <input type="email" placeholder="Váš E-mail" style="padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--surface-border); border-radius: 8px; color: #fff;">
                <textarea rows="5" placeholder="Vaše zpráva" style="padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--surface-border); border-radius: 8px; color: #fff;"></textarea>
                <button type="button" class="btn" style="border: none; cursor: pointer; font-size: 1rem;">Odeslat zprávu</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 PragueGirls Guide od Radky Holubové.</p>
        </div>
    </footer>
</body>
</html>
